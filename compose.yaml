name: astalavista

services:
  database:
    build:
      context: ./database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskUser
      POSTGRES_PASSWORD: jnwjfn31223nd_q3d
      POSTGRES_DB: TaskBase
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  database-api:
    build:
      context: ./database-api
      target: runtime
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    init: true
    # Memory storage belongs to this one process and resets on restart.

  database-api-check:
    profiles: ["tools"]
    build:
      context: ./database-api
      target: checks
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
    init: true

  client:
    build:
      context: ./client
    depends_on:
      database-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      CLIENT_API_URL: ${CLIENT_API_URL:-http://database-api:${API_PORT:-8000}/api/v1}
      CLIENT_BOT_TOKEN: ${CLIENT_BOT_TOKEN}
      CLIENT_BOT_PROXY: ${CLIENT_BOT_PROXY-${https_proxy-${http_proxy}}}

volumes:
  postgres_data:
