name: astalavista

services:
  database:
    build:
      context: ./database
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: taskUser
      POSTGRES_PASSWORD: jnwjfn31223nd_q3d
      POSTGRES_DB: TaskBase
    volumes:
      - postgres_data:/var/lib/postgresql/data
  database-api:
    build:
      context: ./database-api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Moscow}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://taskUser:jnwjfn31223nd_q3d@database:5432/TaskBase}
    depends_on:
      - database
    restart: on-failure
    init: true

volumes:
  postgres_data:
